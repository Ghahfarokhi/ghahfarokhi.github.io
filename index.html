<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Amir Taheri-Ghahfarokhi, Co-founder and Chief Scientific Officer at Immitra Bio.">
  <meta name="theme-color" content="#f7f8fa">
  <title>Amir Taheri-Ghahfarokhi | Immitra Bio</title>
  <style>
    :root { color-scheme: light; --ink:#17233a; --muted:#657084; --line:#dce2e9; --accent:#2d3092; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; }
    body { background:#f7f8fa; color:var(--ink); font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
    main { min-height:100svh; display:flex; align-items:center; justify-content:center; padding:48px 24px; }
    .content { width:100%; max-width:640px; }
    .eyebrow { display:inline-flex; align-items:center; gap:10px; margin:0 0 26px; font-size:12px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:var(--accent); }
    .eyebrow::before { content:""; display:block; width:22px; height:2px; background:var(--accent); }
    h1 { font-size:clamp(38px,7vw,64px); line-height:1.08; letter-spacing:-.05em; font-weight:650; margin:0 0 24px; }
    .role { font-size:clamp(17px,2.5vw,21px); line-height:1.55; margin:0 0 22px; color:#35435a; }
    .description { color:var(--muted); line-height:1.75; font-size:16px; max-width:540px; margin:0 0 34px; }
    .link { display:inline-flex; align-items:center; gap:14px; color:white; background:var(--accent); text-decoration:none; font-size:15px; font-weight:600; border-radius:8px; padding:15px 20px; transition:background .15s ease,transform .15s ease; }
    .link:hover { background:#222471; transform:translateY(-1px); }
    .link:focus-visible { outline:3px solid #9ba7ff; outline-offset:4px; }
    .arrow { font-size:19px; line-height:1; }
    footer { border-top:1px solid var(--line); color:#8290a0; font-size:13px; margin-top:80px; padding-top:20px; }
    @media (max-width:520px) { main{align-items:center;} footer{margin-top:64px;} }
  </style>
</head>
<body>
  <main>
    <div class="content">
      <p class="eyebrow">Genome editing &amp; genetic medicine</p>
      <h1>Amir Taheri-<br>Ghahfarokhi</h1>
      <p class="role">Co-founder &amp; Chief Scientific Officer<br>at <strong>Immitra Bio</strong></p>
      <p class="description">I work at the intersection of genome editing and translational biotechnology, advancing new approaches to genetic medicine.</p>
      <a class="link" href="https://immitrabio.com/" target="_blank" rel="noopener noreferrer" aria-label="Visit the Immitra Bio website (opens in a new tab)">Learn more at Immitra Bio <span class="arrow" aria-hidden="true">↗</span></a>
      <footer>© <span id="year">2026</span> Amir Taheri-Ghahfarokhi</footer>
    </div>
  </main>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
